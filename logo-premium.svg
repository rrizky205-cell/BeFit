<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="fileGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="25%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#AA771C"/>
      <stop offset="75%" stop-color="#FDE08B"/>
      <stop offset="100%" stop-color="#8C5C0C"/>
    </linearGradient>
    <linearGradient id="fileSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="filePlate" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <filter id="fileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Luxury Beveled Medallion -->
  <rect x="5" y="5" width="110" height="110" rx="26" fill="url(#filePlate)" stroke="url(#fileGold)" stroke-width="2.5"/>
  <rect x="9" y="9" width="102" height="102" rx="22" fill="none" stroke="url(#fileSilver)" stroke-width="0.8" opacity="0.4"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#fileGold)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.3"/>
  
  <!-- Interlocking BF Monogram -->
  <!-- GOLD LETTER B -->
  <path d="M 28 24 L 54 24 C 67 24 76 29 76 39 C 76 45 71 50 64 52 C 73 54 80 60 80 71 C 80 82 70 88 54 88 L 28 88 Z M 41 35 L 41 49 L 53 49 C 59 49 63 46 63 42 C 63 37.5 59 35 53 35 Z M 41 59 L 41 77 L 54 77 C 61 77 66 74 66 68 C 66 62 61 59 54 59 Z" 
        fill="url(#fileGold)" filter="url(#fileGlow)"/>
  
  <!-- SILVER/PLATINUM LETTER F (Interlocking right & center) -->
  <path d="M 52 28 L 88 28 L 88 38 L 64 38 L 64 51 L 82 51 L 82 60 L 64 60 L 64 85 L 52 85 Z" 
        fill="url(#fileSilver)" opacity="0.95"/>
  
  <!-- Center Interlock Accent (Gold bar overlap knot) -->
  <rect x="50" y="49" width="16" height="5" rx="1.5" fill="url(#fileGold)"/>
</svg>