    function formatRupiah(num) {
      if (!num || isNaN(num)) return 'Rp 0';
      return 'Rp ' + Number(num).toLocaleString('id-ID');

    function showToast(msg, duration = 3000) {
      const toast = document.getElementById('admin-toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-[-20px]');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-[-20px]');
      }, duration);
    }

    // ==================== DATA RETRIEVAL HELPERS ====================
    function getStoredMembers() {
      try {
        const raw = localStorage.getItem(USERS_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            // Merge with seed members to ensure complete display
            const map = new Map();
            parsed.forEach(m => map.set(m.email || m.id, m));
            SEED_MEMBERS.forEach(s => {
              if (!map.has(s.email)) map.set(s.email, s);
            });
            return Array.from(map.values());
          }
        }
      } catch (e) {}
      return SEED_MEMBERS;
    }

    function getStoredTransactions() {
      try {
        const raw = localStorage.getItem(TRANSACTIONS_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (e) {}
      return [];
    }

    function getStoredPtBookings() {
      try {
        const raw = localStorage.getItem(PT_BOOKINGS_KEY);
        if (raw) {

          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }

      return SEED_PT_BOOKINGS;
    }

    window.handleSearchChange = (val) => {
      searchQuery = val;
      const content = document.getElementById('tab-content');
      if (content && currentTab === 'members') {
        content.innerHTML = renderTabMembers(getStoredMembers());
      }
    };

    // Initial render on load
    document.addEventListener('DOMContentLoaded', () => {
      renderAdminView();
    });
  </script>

</body>
</html>
