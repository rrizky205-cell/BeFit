    function formatRupiah(num) {
      if (!num || isNaN(num)) return 'Rp 0';
      return 'Rp ' + Number(num).toLocaleString('id-ID');
    }

    function formatWhatsAppNumber(phone) {
      if (!phone) return '';
      let clean = phone.replace(/[^0-9]/g, '');
      if (clean.startsWith('0')) clean = '62' + clean.slice(1);
      return clean;
    }

    function getDaysRemaining(expiryDateStr) {
      if (!expiryDateStr) return 0;
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const expiry = new Date(expiryDateStr);
      expiry.setHours(0, 0, 0, 0);
      return Math.ceil((expiry.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));
    }

    function formatDateIndo(dateStr) {
      if (!dateStr) return '-';
      try {
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
          const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
          return `${parts[2]} ${months[d.getMonth()]} ${parts[0]}`;
        }
      } catch (e) {}
      return dateStr;
    }

    function createRetentionPromoWaUrl(m) {
      const daysLeft = Math.max(0, getDaysRemaining(m.expiryDate));

      const message = `Halo Kak ${m.name || 'Member'}! 👋\n\nKami dari tim Be Fit Gym ingin mengapresiasi semangat latihan Kakak selama ini! 💪\n\nMengingatkan bahwa masa aktif paket membership Kakak tersisa ${daysLeft} hari lagi. Supaya latihan Kakak tidak terputus, kami memberikan Promo Spesial Loyalitas: DISKON 25% untuk perpanjangan paket membership!\n\n🎟️ Kode Promo: RENEWLOYAL25 (Otomatis Aktif)\n\nKlik link khusus di bawah ini untuk langsung memilih paket perpanjangan dengan harga yang sudah didiskon 25%:\n👉 ${magicLink}\n\nYuk klaim sekarang sebelum masa aktif berakhir ya, Kak! 😊`;

      return `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;
    }

    function showToast(msg, duration = 3000) {

      if (!toast) return;
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-[-20px]');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-[-20px]');
      }, duration);
    }

    // ==================== DATA RETRIEVAL & PERSISTENCE ====================
    function getStoredMembers() {
      try {
        const raw = localStorage.getItem(USERS_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            const map = new Map();
            // Seed members first
            SEED_MEMBERS.forEach(s => map.set(s.email || s.id, { ...s }));
            // Merge stored members
            parsed.forEach(m => {
              const key = m.email || m.id;
              const existing = map.get(key) || {};
              map.set(key, {
                ...existing,
                ...m,
                id: m.id || existing.id || 'BF-' + Math.floor(1000 + Math.random() * 9000),
                name: m.name || existing.name || 'Member Be Fit',
                email: m.email || existing.email || '-',
                phone: m.phone || existing.phone || '08123456789',
                expiryDate: m.expiryDate || existing.expiryDate || '2026-11-20',
                status: m.status || existing.status || 'Active',
                isFrozen: m.isFrozen !== undefined ? m.isFrozen : (existing.isFrozen || false),
                totalPaid: m.totalPaid || existing.totalPaid || 765000,
                branch: m.branch || existing.branch || 'Setiabudi',
                packageType: m.packageType || existing.packageType || 'Pro Transformation',
                packageDuration: m.packageDuration || existing.packageDuration || 'Paket 3 Bulan'
              });
            });
            return Array.from(map.values());
          }
        }
      } catch (e) {}
      saveMembers(SEED_MEMBERS);
      return SEED_MEMBERS;
    }

    function saveMembers(list) {
      try {
        localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(list));

    }

    function getStoredTransactions() {

        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (e) {}
      return [];
    }

          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed.map(b => ({
              ...b,
              remainingSessions: b.remainingSessions !== undefined ? b.remainingSessions : (b.sessions || 4),
              status: b.remainingSessions === 0 ? 'Selesai / Kuota Habis' : (b.status || 'Aktif Berjalan')
            }));
          }
        }
      } catch (e) {}
      savePtBookings(SEED_PT_BOOKINGS);
      return SEED_PT_BOOKINGS;
    }

    window.toggleMemberFreeze = (memberId) => {
      const members = getStoredMembers();
      const idx = members.findIndex(m => m.id === memberId || m.email === memberId);
      if (idx !== -1) {
        members[idx].isFrozen = !members[idx].isFrozen;
        saveMembers(members);
        showToast(members[idx].isFrozen 
          ? `Status membership ${members[idx].name} dibekukan (Cuti).` 
          : `Status membership ${members[idx].name} diaktifkan kembali.`);
        renderAdminView();
      }
    };

    window.extendMemberManual = (memberId) => {
      const members = getStoredMembers();
      const idx = members.findIndex(m => m.id === memberId || m.email === memberId);
      if (idx !== -1) {
        const currentExp = members[idx].expiryDate ? new Date(members[idx].expiryDate) : new Date();
        const baseDate = currentExp > new Date() ? currentExp : new Date();
        const newExpiry = new Date(baseDate.getTime() + 30 * 86400000).toISOString().split('T')[0];
        
        members[idx].expiryDate = newExpiry;
        members[idx].status = 'Active';
        members[idx].isFrozen = false;
        saveMembers(members);
        
        showToast(`Masa aktif ${members[idx].name} berhasil diperpanjang +30 hari (s/d ${formatDateIndo(newExpiry)})!`, 4000);
        renderAdminView();
      }
    };

    window.checkInPtSession = (orderId) => {
      const bookings = getStoredPtBookings();
      const idx = bookings.findIndex(b => b.id === orderId);
      if (idx !== -1) {
        const currentRemaining = bookings[idx].remainingSessions !== undefined ? bookings[idx].remainingSessions : bookings[idx].sessions;
        if (currentRemaining > 0) {
          bookings[idx].remainingSessions = currentRemaining - 1;
          if (bookings[idx].remainingSessions === 0) {
            bookings[idx].status = 'Selesai / Kuota Habis';
            showToast(`Sesi PT ${bookings[idx].userName} selesai (Kuota habis). Tawarkan paket perpanjangan via WA!`, 4500);

            showToast(`Check-in sesi PT berhasil! Sisa kuota ${bookings[idx].userName}: ${bookings[idx].remainingSessions} sesi.`, 3500);
          }
          savePtBookings(bookings);
          renderAdminView();
        }
      }
    };

        renderAdminView();
      }
    };

        // Status filter
        const days = getDaysRemaining(m.expiryDate);
        if (memberFilterStatus === 'expiring' && !(days > 0 && days <= 7 && !m.isFrozen)) return false;
        if (memberFilterStatus === 'active' && !(days > 7 && !m.isFrozen)) return false;
        if (memberFilterStatus === 'frozen' && !m.isFrozen) return false;
        if (memberFilterStatus === 'expired' && !((days <= 0 || m.status === 'Expired') && !m.isFrozen)) return false;

        // Search filter
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return (m.name && m.name.toLowerCase().includes(q)) ||
               (m.email && m.email.toLowerCase().includes(q)) ||
               (m.phone && m.phone.includes(q)) ||
               (m.branch && m.branch.toLowerCase().includes(q)) ||
               (m.packageType && m.packageType.toLowerCase().includes(q));

              <button type="button" onclick="setMemberStatusFilter('active')"

                ✓ Aktif (${activeCount})

              <button type="button" onclick="setMemberStatusFilter('frozen')"

              <button type="button" onclick="setMemberStatusFilter('expired')"

                  <th class="px-6 py-3.5">Paket & Cabang</th>

                  <th class="px-6 py-3.5 text-center">Aksi Cepat CRM</th>

              </thead>
              <tbody class="divide-y divide-slate-100">
                ${filtered.length === 0 ? `

                  const isExpired = (days <= 0 || m.status === 'Expired') && !m.isFrozen;

                  let daysBadgeHtml = '';
                  let statusBadgeHtml = '';

                  if (isFrozen) {

                    statusBadgeHtml = `<span class="px-2.5 py-1 rounded-full text-[10px] font-black uppercase bg-emerald-100 text-emerald-800 border border-emerald-300">AKTIF</span>`;

                      <!-- 2. Paket & Cabang -->
                      <td class="px-6 py-4">

                      <!-- 3. Tanggal Berakhir & Sisa Hari -->

                      <!-- 4. Status Akun -->
                      <td class="px-6 py-4">

                      <td class="px-6 py-4 font-mono font-black text-teal-600">

                      <!-- 6. Aksi Cepat CRM -->

                          <!-- WhatsApp Button -->
                          <a href="${waUrl}" target="_blank" rel="noopener noreferrer"

                            title="Kirim Promo 25% (WA) dengan Deep-Link Perpanjangan">
                            <span>💬 Kirim Promo 25% (WA)</span>
                          </a>

                          <!-- Cuti / Freeze Button -->
                          <button type="button" onclick="toggleMemberFreeze('${m.id}')"
                            class="px-2.5 py-1.5 rounded-lg border font-bold text-[11px] transition-all ${isFrozen ? 'bg-blue-600 text-white border-blue-600 hover:bg-blue-700' : 'bg-slate-100 text-slate-700 border-slate-300 hover:bg-slate-200'}"

                        <span class="text-[10px] text-slate-400 font-mono">${t.phone || '-'}</span>
                      </td>
                      <td class="px-6 py-4 font-medium text-slate-700">${t.branch}</td>
                      <td class="px-6 py-4 font-mono text-slate-500 text-[11px]">${t.dateClaimed || '02 Nov 2026'}</td>
                      <td class="px-6 py-4 font-mono font-bold text-teal-600">7 Hari Sejak Klaim</td>
                      <td class="px-6 py-4">
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-black uppercase bg-emerald-100 text-emerald-800 border border-emerald-300">
                          ${t.status || 'Aktif (7 Hari)'}
                        </span>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

        </div>
      `;
    }

    // ==================== INTERACTION HANDLERS ====================
    window.switchAdminTab = (tab) => {
      currentTab = tab;
      renderAdminView();
    };

    window.setMemberStatusFilter = (status) => {
      memberFilterStatus = status;
      renderAdminView();
    };

    window.handleSearchChange = (val) => {
      searchQuery = val;
      const content = document.getElementById('tab-content');
      if (content && currentTab === 'members') {
        content.innerHTML = renderTabMembers(getStoredMembers());
      }
    };

    // Initial render on load
    document.addEventListener('DOMContentLoaded', () => {
      renderAdminView();
    });
  </script>

</body>
</html>
