    function relativeDateStr(daysFromNow) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + Number(daysFromNow || 0));
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function parseDateLocal(dateStr) {
      if (!dateStr || typeof dateStr !== 'string') return null;
      const parts = dateStr.trim().split('T')[0].split('-');
      if (parts.length === 3) {
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        const d = parseInt(parts[2], 10);
        const dt = new Date(y, m, d);
        if (!isNaN(dt.getTime())) {
          dt.setHours(0, 0, 0, 0);
          return dt;
        }
      }
      const fallback = new Date(dateStr);
      if (isNaN(fallback.getTime())) return null;
      fallback.setHours(0, 0, 0, 0);
      return fallback;
    }

      if (!expiry) return 0;
      return Math.round((expiry.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));

    function formatDateIndo(dateStr) {
      if (!dateStr) return '-';

          const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
          return `${parts[2]} ${months[d.getMonth()]} ${parts[0]}`;
        }
      } catch (e) {}
      return dateStr;
    }

      try {

        if (ver !== CURRENT_DATA_VERSION || !Array.isArray(members) || members.length < 24) {

                  !!m.lastPaymentAt;
                const parsedMExp = parseDateLocal(m.expiryDate);
                const parsedDefExp = parseDateLocal(def.expiryDate);
                const keepStoredExpiry = m.expiryDate && (hasRealUpgrade || (parsedMExp && parsedDefExp && parsedMExp > parsedDefExp));
                map.set(key, {
                  ...def,
                  ...m,
                  expiryDate: keepStoredExpiry ? m.expiryDate : def.expiryDate,
                  branch: m.branch || def.branch,
                  packageDuration: (hasRealUpgrade && m.packageDuration) ? m.packageDuration : (m.packageDuration || def.packageDuration),
                  packageType: (hasRealUpgrade && m.packageType) ? m.packageType : (m.packageType || def.packageType),
                  membershipPackage: m.membershipPackage || def.membershipPackage || def.packageDuration,
                  totalPaid: Math.max(Number(m.totalPaid) || 0, Number(def.totalPaid) || 0),
                  isPaidMember: m.isPaidMember !== undefined ? m.isPaidMember : def.isPaidMember,
                  status: (m.status && (hasRealUpgrade || Number(m.totalPaid) > 0)) ? m.status : def.status,
                  membershipStatus: (m.membershipStatus && (hasRealUpgrade || Number(m.totalPaid) > 0)) ? m.membershipStatus : (def.membershipStatus || 'Aktif')

          saveMembers(members);

        return members.filter(m => m.role !== 'admin');

    // Calculate Branch Analytics from Live App Data
    function computeBranchAnalytics(members, ptBookings) {
      return BRANCH_CONFIGS.map(b => {
        const bMembers = members.filter(m => (m.branch || '').toLowerCase().includes(b.shortName.toLowerCase()));
        const membershipRev = bMembers.reduce((sum, m) => {
          const memPaid = m.membershipPaid !== undefined
            ? Number(m.membershipPaid || 0)
            : Math.max(0, Number(m.totalPaid || 0) - Number(m.ptPaid || 0));
          return sum + memPaid;
        }, 0);
        
        const bPt = ptBookings.filter(pt => (pt.branch || '').toLowerCase().includes(b.shortName.toLowerCase()));
        const ptRev = bPt.reduce((sum, pt) => sum + Number(pt.totalPaid || 0), 0);
        const ptActiveSessions = bPt.reduce((sum, pt) => {
          const rem = pt.remainingSessions !== undefined ? pt.remainingSessions : pt.sessions;
          return sum + Number(rem || 0);
        }, 0);

        return {
          ...b,
          memberCount: bMembers.length,
          membershipRev,
          ptRev,
          totalRev: membershipRev + ptRev,
          ptActiveSessions
        };
      });
    }

    function renderTabMembers(members) {
      // Counts for filter pills - STRICTLY CHECK PAID STATUS

        if (!isUserPaidMember(m)) return false;
        const d = getDaysRemaining(m.expiryDate);
        return d >= 1 && d <= 10 && !m.isFrozen;
      }).length;

      const activeCount = members.filter(m => {
        if (!isUserPaidMember(m)) return false;
        const d = getDaysRemaining(m.expiryDate);
        return d > 10 && !m.isFrozen;
      }).length;

      const unpaidCount = members.filter(m => !isUserPaidMember(m)).length;

      const frozenCount = members.filter(m => m.isFrozen).length;

      const expiredCount = members.filter(m => {
        if (!isUserPaidMember(m)) return false;
        const d = getDaysRemaining(m.expiryDate);
        return (d <= 0 || m.status === 'Expired') && !m.isFrozen;
      }).length;

      // Filtered members by search and status
      const filtered = members.filter(m => {
        const isPaid = isUserPaidMember(m);
        const days = isPaid ? getDaysRemaining(m.expiryDate) : 0;

        // Status filter
        if (memberFilterStatus === 'expiring' && !(isPaid && days >= 1 && days <= 10 && !m.isFrozen)) return false;
        if (memberFilterStatus === 'active' && !(isPaid && days > 10 && !m.isFrozen)) return false;
        if (memberFilterStatus === 'unpaid' && isPaid) return false;
        if (memberFilterStatus === 'frozen' && !m.isFrozen) return false;
        if (memberFilterStatus === 'expired' && !(isPaid && (days <= 0 || m.status === 'Expired') && !m.isFrozen)) return false;

        // Search filter
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return (m.name && m.name.toLowerCase().includes(q)) ||
               (m.email && m.email.toLowerCase().includes(q)) ||
               (m.phone && m.phone.includes(q)) ||
               (m.branch && m.branch.toLowerCase().includes(q)) ||
               (m.membershipPackage && m.membershipPackage.toLowerCase().includes(q)) ||
               (m.packageType && m.packageType.toLowerCase().includes(q));
      }).sort((a, b) => Number(b.createdAtTimestamp || 0) - Number(a.createdAtTimestamp || 0));

      return `

              <button type="button" onclick="setMemberStatusFilter('expired')"

                              ${m.isFrozen ? 'Buka Cuti' : 'Bekukan'}

                              class="px-2 py-1.5 rounded-lg bg-teal-50 text-teal-700 hover:bg-teal-100 border border-teal-200 text-[11px] font-bold transition-all whitespace-nowrap cursor-pointer"
                              title="Perpanjang Masa Aktif +30 Hari">
                              +30 Hari
                            </button>

                            <button type="button" onclick="extendMemberManual('${m.id}')"
                              class="px-2 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-[11px] font-bold transition-all whitespace-nowrap cursor-pointer"
                              title="Aktifkan Paket 30 Hari">

                        </div>
                      </td>
                    </tr>

              </tbody>
            </table>
          </div>
        </div>
      `;

      memberFilterStatus = status;
      renderAdminView();

    window.handleSearchChange = (val) => {
      searchQuery = val;

      if (content && currentTab === 'members') {
        content.innerHTML = renderTabMembers(getStoredMembers());

    function getCloudSyncUrl() {
      if (typeof window !== 'undefined' && window.BEFIT_CLOUD_ENDPOINT) {
        return window.BEFIT_CLOUD_ENDPOINT;
      }
      return DEFAULT_CLOUD_SYNC_URL;
    }

    function readRawUsersStorage() {
      try {
        const raw = localStorage.getItem(USERS_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function mergeCloudUsersAdmin(localUsers, remoteUsers) {
      const map = new Map();
      const ingest = (u) => {
        if (!u || typeof u !== 'object') return;
        const key = String(u.email || u.id || '').toLowerCase().trim();
        if (!key) return;
        const existing = map.get(key);
        if (!existing) {
          map.set(key, { ...u });
          return;
        }
        const existingTs = Number(existing.lastUpdatedAt || existing.createdAtTimestamp || 0);
        const incomingTs = Number(u.lastUpdatedAt || u.createdAtTimestamp || 0);
        const existingPaid = Number(existing.totalPaid || 0);
        const incomingPaid = Number(u.totalPaid || 0);
        const pickIncoming = incomingTs !== existingTs
          ? incomingTs > existingTs
          : (incomingPaid >= existingPaid);
        const base = pickIncoming ? { ...existing, ...u } : { ...u, ...existing };
        base.createdAtTimestamp = Math.max(Number(existing.createdAtTimestamp || 0), Number(u.createdAtTimestamp || 0));
        base.lastUpdatedAt = Math.max(existingTs, incomingTs);
        map.set(key, base);
      };
      (Array.isArray(localUsers) ? localUsers : []).forEach(ingest);
      (Array.isArray(remoteUsers) ? remoteUsers : []).forEach(ingest);
      return Array.from(map.values()).sort((a, b) => Number(b.createdAtTimestamp || 0) - Number(a.createdAtTimestamp || 0));
    }

    function mergeCloudTransactionsAdmin(localTx, remoteTx) {
      const map = new Map();
      const ingest = (t) => {
        if (!t || typeof t !== 'object') return;
        const id = t.id || `${t.title || t.packageName || ''}_${t.date || ''}_${t.amount || 0}`;
        if (!map.has(id)) map.set(id, t);
      };
      (Array.isArray(localTx) ? localTx : []).forEach(ingest);
      (Array.isArray(remoteTx) ? remoteTx : []).forEach(ingest);
      return Array.from(map.values());
    }

    function mergeCloudPtOrdersAdmin(localPt, remotePt) {
      const map = new Map();
      const ingest = (o) => {
        if (!o || typeof o !== 'object') return;
        const oid = String(o.orderId || o.id || '');
        if (!oid) return;
        const existing = map.get(oid);
        if (!existing) {
          map.set(oid, { ...o });
          return;
        }
        const remA = existing.remainingSessions !== undefined ? Number(existing.remainingSessions) : Number(existing.sessions || 4);
        const remB = o.remainingSessions !== undefined ? Number(o.remainingSessions) : Number(o.sessions || 4);
        const tsA = Number(existing.updatedAt || existing.createdAtTimestamp || 0);
        const tsB = Number(o.updatedAt || o.createdAtTimestamp || 0);
        if (tsB > tsA || (tsB === tsA && remB < remA)) {
          map.set(oid, { ...existing, ...o });
        }
      };
      (Array.isArray(localPt) ? localPt : []).forEach(ingest);
      (Array.isArray(remotePt) ? remotePt : []).forEach(ingest);
      return Array.from(map.values());
    }

    async function pullCloudSync(isManual = false) {
      if (typeof fetch !== 'function' || cloudSyncBusy) return false;
      cloudSyncBusy = true;
      const syncBtn = document.getElementById('btn-cloud-sync-admin');
      if (isManual && syncBtn) {
        syncBtn.innerHTML = '<span>⏳ Menyinkronkan...</span>';
      }
      try {
        const url = getCloudSyncUrl();
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 4000);
        const res = await fetch(url, { method: 'GET', cache: 'no-store', signal: ctrl.signal });
        clearTimeout(t);
        if (!res.ok) {
          if (isManual) showToast('Belum ada data cloud baru atau server sedang sibuk.');
          return false;
        }
        const txt = await res.text();
        if (!txt || !txt.trim().startsWith('{')) {
          if (isManual) showToast('Data lokal sudah paling baru.');
          return false;
        }
        const remote = JSON.parse(txt);

        // Ensure baseline seeds are initialized before merging
        getStoredMembers();
        const localRawUsers = readRawUsersStorage();
        const localTx = getStoredTransactions();
        const localPt = getStoredPtBookings();

        const mergedUsers = mergeCloudUsersAdmin(localRawUsers, remote.users);
        const mergedTx = mergeCloudTransactionsAdmin(localTx, remote.transactions);
        const mergedPt = mergeCloudPtOrdersAdmin(localPt, remote.ptOrders);

        const prevSig = getAdminDataSignature();
        localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(mergedUsers));
        localStorage.setItem(TRANSACTIONS_KEY, JSON.stringify(mergedTx));
        localStorage.setItem(TRANSACTIONS_ALT_KEY, JSON.stringify(mergedTx));
        localStorage.setItem(PT_BOOKINGS_KEY, JSON.stringify(mergedPt));
        localStorage.setItem(PT_ORDERS_KEY, JSON.stringify(mergedPt));

        // Sync active mobile session user if open on same device
        try {
          const curRaw = localStorage.getItem(CURRENT_USER_KEY);
          if (curRaw) {
            const cur = JSON.parse(curRaw);
            const matched = mergedUsers.find(u => cur && cur.email && u.email && u.email.toLowerCase() === cur.email.toLowerCase());
            if (matched) {
              localStorage.setItem(CURRENT_USER_KEY, JSON.stringify({ ...cur, ...matched }));
            }
          }
        } catch (e) {}

        const nowDate = new Date();
        lastCloudSyncAt = nowDate.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const nextSig = getAdminDataSignature();
        lastAdminDataSignature = nextSig;

        const searchInput = document.getElementById('member-search-input');
        const isTyping = searchInput && document.activeElement === searchInput;

        if ((nextSig !== prevSig || isManual) && !isTyping && isAdminLoggedIn()) {
          renderAdminView();
        } else {
          const statusEl = document.getElementById('cloud-sync-status-text');
          if (statusEl) statusEl.textContent = `Sync: ${lastCloudSyncAt}`;
        }

        if (isManual) {
          showToast('✅ Data terbaru berhasil disinkronkan (Cloud & Lokal)!', 3000);
        }
        return true;
      } catch (e) {
        if (isManual) showToast('Gagal terhubung ke Cloud Sync. Menggunakan data lokal.', 3500);
        return false;
      } finally {
        cloudSyncBusy = false;
        const btn = document.getElementById('btn-cloud-sync-admin');
        if (btn) btn.innerHTML = '<span>🔄 Sinkronkan Data Terbaru</span>';
      }
    }

    async function pushCloudSync() {
      if (typeof fetch !== 'function') return;
      try {
        const url = getCloudSyncUrl();
        const localRawUsers = readRawUsersStorage();
        const localTx = getStoredTransactions();
        const localPt = getStoredPtBookings();

        let remoteData = {};
        try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 3500);
          const g = await fetch(url, { method: 'GET', cache: 'no-store', signal: ctrl.signal });
          clearTimeout(t);
          if (g.ok) {
            const txt = await g.text();
            if (txt && txt.trim().startsWith('{')) remoteData = JSON.parse(txt);
          }
        } catch (e) {}

        const mergedUsers = mergeCloudUsersAdmin(localRawUsers, remoteData.users);
        const mergedTx = mergeCloudTransactionsAdmin(localTx, remoteData.transactions);
        const mergedPt = mergeCloudPtOrdersAdmin(localPt, remoteData.ptOrders);

        const payload = JSON.stringify({
          updatedAt: Date.now(),
          version: CURRENT_DATA_VERSION,
          users: mergedUsers,
          transactions: mergedTx,
          ptOrders: mergedPt
        });

        await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: payload
        });
      } catch (e) {}
    }

    function safeParse(raw, fallback = null) {
      if (!raw || typeof raw !== 'string') return fallback;
      try {
        const parsed = JSON.parse(raw);
        return parsed !== null && parsed !== undefined ? parsed : fallback;
      } catch (err) {
        console.warn('safeParse fallback:', err);
        return fallback;
      }
    }

    window.safeParse = safeParse;
    window.pullCloudSync = pullCloudSync;
    window.pushCloudSync = pushCloudSync;
    window.syncCloudManual = () => pullCloudSync(true);

    // Initial render on load
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const demo = urlParams.get('demo');
        if (demo === 'overview' || demo === 'crm') {
          sessionStorage.setItem(ADMIN_AUTH_KEY, 'true');
          localStorage.setItem(ADMIN_AUTH_KEY, 'true');
          if (demo === 'crm') {
            currentTab = 'members';
          } else {
            currentTab = 'overview';
          }
        }
        renderAdminView();
      } catch (err) {
        console.warn('Admin DOMContentLoaded fallback:', err);
      }
    });

    // Trigger Cloud Sync strictly after full page load
    window.addEventListener('load', () => {
      try {
        if (isAdminLoggedIn() && !(typeof window !== 'undefined' && window.BEFIT_SKIP_INIT_PULL)) {
          Promise.resolve(pullCloudSync(false)).catch(err => console.warn('Admin cloud pull skipped:', err));
        }
      } catch (err) {
        console.warn('Admin cloud load error:', err);
      }
    });

    // Real-time synchronization with localStorage (cross-tab sync) & Cloud Sync (cross-device 3s polling)
    let lastAdminDataSignature = '';
    function getAdminDataSignature() {
      const tx = localStorage.getItem(TRANSACTIONS_KEY) || '';
      const txAlt = localStorage.getItem(TRANSACTIONS_ALT_KEY) || '';
      const mem = localStorage.getItem(USERS_STORAGE_KEY) || '';
      const pt = localStorage.getItem(PT_BOOKINGS_KEY) || '';
      const ptAlt = localStorage.getItem(PT_ORDERS_KEY) || '';
      const ts = localStorage.getItem(SYNC_TS_KEY) || '';
      return `${ts}|${tx}|${txAlt}|${mem}|${pt}|${ptAlt}`;
    }

    function syncAdminDataRealtime() {
      if (!isAdminLoggedIn()) return;
      const sig = getAdminDataSignature();
      if (lastAdminDataSignature && sig !== lastAdminDataSignature) {
        lastAdminDataSignature = sig;
        const searchInput = document.getElementById('member-search-input');
        if (!searchInput || document.activeElement !== searchInput) {
          renderAdminView();
        }
      } else if (!lastAdminDataSignature) {
        lastAdminDataSignature = sig;
      }
    }

    window.addEventListener('storage', (e) => {
      if (!e.key || e.key === USERS_STORAGE_KEY || e.key === TRANSACTIONS_KEY || e.key === TRANSACTIONS_ALT_KEY || e.key === PT_BOOKINGS_KEY || e.key === PT_ORDERS_KEY || e.key === SYNC_TS_KEY || e.key === ADMIN_AUTH_KEY) {
        if (isAdminLoggedIn()) {
          lastAdminDataSignature = getAdminDataSignature();
          renderAdminView();
        }
      }
    });

    setInterval(syncAdminDataRealtime, 2000);
    setInterval(() => {
      if (isAdminLoggedIn() && !(typeof window !== 'undefined' && window.BEFIT_DISABLE_AUTO_CLOUD_POLL)) {
        void pullCloudSync(false);
      }
    }, 3000);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isAdminLoggedIn()) {
        renderAdminView();
        void pullCloudSync(false);
      }
    });
  </script>
